[workspace]
resolver = "2"
members = ["crates/ui-part", "crates/ui-chain", "crates/ui-manifest", "crates/site-gateway", "crates/ui-gen"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
ce-wire = { git = "https://github.com/Leif-Rydenfalk/rust-stack", rev = "2aede6d81d2d856d1d17b383624dfd19ce6aeba9", default-features = false, features = ["codec"] }
ce-gate = { git = "https://github.com/Leif-Rydenfalk/rust-stack", rev = "2aede6d81d2d856d1d17b383624dfd19ce6aeba9" }
