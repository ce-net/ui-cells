[package]
name = "ui-manifest"
version = "0.1.0"
description = "ui.manifest Resolve: a site's route and slot tree, resolved per viewer to only the view bundles that viewer's rights may receive, each with its sha256"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ui-part = { path = "../ui-part" }

[dev-dependencies]
ce-wire = { workspace = true }
