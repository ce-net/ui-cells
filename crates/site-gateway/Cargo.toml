[package]
name = "site-gateway"
version = "0.1.0"
description = "The minimum site.gateway with ui.serve: behind the apps.ce-net.com sign-in, a person's grant, their manifest, only the bundles their rights may receive, and one socket to wire.ws-door"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ui-manifest = { path = "../ui-manifest" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
